      - {nombre: "IPC empalmado (ver Inflación minorista)", nivel: primaria, nota: "Deflactor"}
    metodo: "Ingreso per cápita familiar: ingreso total del hogar dividido por sus integrantes; las personas se ordenan en deciles según ese ingreso. Los deciles 1 y 2 no se publican en la serie abierta: el promedio de los deciles 1 a 4 se obtiene del promedio total (que es el promedio de los 10 deciles) menos los deciles 5 a 10. Se usan estratos de ingreso y no clases sociales: la clase depende también de la educación, la ocupación y el patrimonio, que esta serie no mide. Pesos llevados al último mes con dato con el IPC empalmado."

