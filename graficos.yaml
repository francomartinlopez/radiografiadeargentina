    metodo: "Estimaciones anuales de OMS y UNICEF a partir de los registros del Ministerio de Salud y de encuestas. El original mostraba el porcentaje de adultos que no completan el calendario y sus razones (falta de vacunas o rechazo): no hay ninguna fuente pública con ese dato, así que se muestra la cobertura infantil, que es el indicador oficial de seguimiento."

