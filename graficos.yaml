      - {nombre: "Secretaría de Derechos Humanos, Registro Unificado de Víctimas del Terrorismo de Estado (RUVTE), informe 2015", url: "https://www.argentina.gob.ar/node/323004", nivel: primaria}
      - {nombre: "CONADEP (1984) e informe de la Secretaría de Derechos Humanos (2006), resumidos por La Nación", url: "https://www.lanacion.com.ar/politica/el-numero-de-30000-desaparecidos-esta-lejos-de-las-victimas-registradas-por-la-conadep-nid25032024/", nivel: secundaria}
    metodo: "Son listas nominales de víctimas con denuncia formal, no estimaciones del total. Según un informe del RUVTE de 2016, entre octubre de 1973 y diciembre de 1983 hubo 7.010 desapariciones forzadas (662 durante el gobierno de María Estela Martínez de Perón y 6.348 desde el golpe de 1976) y 1.561 asesinatos; el registro tenía además 135 casos en investigación y 789 sin denuncia penal. Ningún registro oficial lista a las personas que fueron secuestradas, torturadas o detenidas en centros clandestinos y sobrevivieron, que el RUVTE describe como la mayoría de las víctimas. En estas listas, desaparecido es quien nunca reapareció con vida y cuyos restos no se encontraron; asesinado, quien fue muerto y tiene sus restos identificados: en ambos casos son personas muertas o presuntamente muertas. Las estimaciones y las víctimas de las organizaciones armadas están en el gráfico siguiente."

  - id: victimas_violencia_politica_estimadas
    tema: 21
    titulo: "Víctimas de la violencia política de los años setenta según quién la ejerció (estimaciones)"
    que_muestra: "Rango de estimaciones de personas desaparecidas o asesinadas por el terrorismo de Estado, por la Triple A y otros grupos parapoliciales, y por las organizaciones armadas (Montoneros, ERP y otras)."
    original: {ficha: p444, imagen: 1380}
    tipo: barras
    categorias: victimas_estimadas_7383
    unidad: "personas"
    tipo_valor: nivel
    estimacion: "Estimaciones de distintas fuentes, de calidad desigual: el rango muestra la cifra más baja y la más alta que se citan con fuente identificable."
    fuentes:
      - {nombre: "Terrorismo de Estado: RUVTE 2015 (8.631, piso documentado) y cómputo del Batallón 601 de Inteligencia de 1978 (22.000), según documentos desclasificados en EE.UU. (Chequeado)", url: "https://chequeado.com/el-explicador/la-cifra-de-los-desaparecidos-durante-la-ultima-dictadura-militar-cual-es-el-origen-de-los-datos-disponibles/", nivel: estimacion}
      - {nombre: "Triple A: asesinatos parapoliciales registrados por la CONADEP en 1973-1975 (458) y estimación atribuida a la causa judicial (unos 1.500)", url: "https://www.elheraldo.hn/mundo/detienen-a-7-extriple-a-por-crimenes-politicos-en-anos-70-DLEH602735", nivel: estimacion}
      - {nombre: "Organizaciones armadas: listas de Hugo Gambini (547) y relevamiento privado del CELTYV, 1969-1979 (1.094 muertos, además de 2.368 heridos y 758 secuestrados)", url: "https://www.lanacion.com.ar/opinion/montoneros-erp-mataron-mas-eta-menos-tiempo-nid2547514", nivel: estimacion}
    metodo: "Períodos: terrorismo de Estado, 1973-1983 (desaparecidos y asesinados); Triple A y grupos parapoliciales, 1973-1976 (asesinatos); organizaciones armadas, 1969-1979 (asesinatos). No hay un registro oficial de las víctimas de la Triple A separado del de terrorismo de Estado (el RUVTE incluye parte de esas víctimas desde 1973) ni ningún registro oficial de las víctimas de las organizaciones armadas: para ambos se usan relevamientos judiciales, periodísticos y de asociaciones, con criterios y períodos distintos. Las cifras de la Triple A van de 458 asesinatos parapoliciales registrados por la CONADEP a unos 1.500 que se atribuyen a la investigación judicial; otras fuentes hablan de 600 a 2.000. Para las organizaciones armadas, el CELTYV (asociación de familiares de víctimas) cuenta 1.094 muertos entre 1969 y 1979; también publicó una cifra de 13.074 víctimas que no fue verificada por otras fuentes y no se usa. Para el terrorismo de Estado se comparan muertos y desaparecidos que no reaparecieron con vida, igual que en los otros dos grupos: el piso son las víctimas con nombre y denuncia del RUVTE (que no incluye a los sobrevivientes) y el techo es el cómputo de 22.000 muertos y desaparecidos entre 1975 y mediados de 1978 que el Batallón 601 pasó a la inteligencia chilena, conocido por documentos desclasificados en EE.UU.; es una estimación sin listado de nombres y no cubre todo el período. La última barra (Incl. sobrevivientes) muestra otra medida, que no se compara con las anteriores: las víctimas de desaparición contando también a quienes sobrevivieron. La cifra de 30.000 desaparecidos que sostienen los organismos de derechos humanos va ahí y no como techo de los muertos porque no mide lo mismo: no tiene un cálculo publicado detrás, y según el investigador Emilio Crenzel solo se aproxima a ella si se suman, además de los muertos y desaparecidos, los sobrevivientes de los centros clandestinos, los presos políticos que pasaron por una desaparición y los casos no denunciados (su propia suma da unos 20.000, que se usa como piso de esa barra). Con cualquiera de las fuentes, las víctimas del terrorismo de Estado son varias veces más que las de la Triple A y las de las organizaciones armadas."

  - id: victimas_sobrevivientes_7383
    tema: 21
    titulo: "Víctimas que sobrevivieron: secuestros, detenciones y heridos (estimaciones)"
    que_muestra: "Personas que sobrevivieron a la represión del Estado (liberadas de centros clandestinos o presas a disposición del Poder Ejecutivo) y personas secuestradas o heridas por las organizaciones armadas."
    original: {ficha: p444, imagen: 1380}
    tipo: barras
    categorias: sobrevivientes_7383
    unidad: "personas"
    tipo_valor: nivel
    estimacion: "Registros incompletos y estimaciones de distintas fuentes: ninguna cifra cuenta a todas las víctimas que sobrevivieron."
    fuentes:
      - {nombre: "RUVTE: 3.432 liberados de centros clandestinos registrados y estimación de al menos cinco veces más (citado en Revista Sociedad y Tecnología, U. de Valparaíso)", url: "https://rcs.uv.cl/index.php/syt/article/download/5559/4968/23403", nivel: estimacion}
      - {nombre: "Presos políticos: 8.625 registrados por la CONADEP y 12.000 denunciados por los organismos de derechos humanos (Crenzel, Latin American Research Review)", url: "https://www.cambridge.org/core/product/E9485B72CFF433F9F64858317AAD4A64/core-reader", nivel: estimacion}
      - {nombre: "Organizaciones armadas, 1969-1979: relevamientos de Carlos Manfroni y del CELTYV (secuestros y heridos civiles, más militares y policías)", url: "https://www.lanacion.com.ar/opinion/montoneros-erp-mataron-mas-eta-menos-tiempo-nid2547514", nivel: estimacion}
    metodo: "CCD: centros clandestinos de detención. PEN: presos a disposición del Poder Ejecutivo Nacional. Torturas y violaciones: no hay un conteo de víctimas para ningún grupo. El Juicio a las Juntas (1985) dio por probado que la tortura era sistemática en los centros clandestinos, así que prácticamente todas las personas liberadas de ellos la sufrieron; la violencia sexual en esos centros fue probada en juicios posteriores, sin una cifra total. Muchos presos a disposición del Poder Ejecutivo pasaron antes por una desaparición. Organizaciones armadas: secuestros extorsivos y políticos (775 según Manfroni; 758 civiles y 34 militares y policías según La Nación) y heridos en atentados (2.368 civiles; con militares y policías, 3.437); varios secuestrados estuvieron cautivos en 'cárceles del pueblo'. Triple A: no hay estimación de heridos ni de secuestros que no terminaron en muerte; la fiscalía registró, solo entre julio y septiembre de 1974, 44 heridos graves. Las cifras de distintos grupos no son comparables entre sí."

  - id: nietos_apropiados
    tema: 21
    titulo: "Niños apropiados durante el terrorismo de Estado"
    que_muestra: "Hijos e hijas de personas desaparecidas que fueron apropiados (nacidos en cautiverio o secuestrados con sus padres): estimación total, identidades restituidas y casos que se siguen buscando."
    original: {ficha: p444, imagen: 1380}
    tipo: barras
    categorias: nietos_apropiados
    unidad: "personas"
    tipo_valor: nivel
    fuentes:
      - {nombre: "Abuelas de Plaza de Mayo: restitución del nieto 140 (7 de julio de 2025) y casos que faltan encontrar", url: "https://www.c5n.com/politica/abuelas-plaza-de-mayo-nieto-140-lunes-7-julio-2025", nivel: secundaria}
      - {nombre: "Abuelas de Plaza de Mayo, sitio oficial", url: "https://www.abuelas.org.ar/", nivel: secundaria}
    metodo: "Estimados: niños apropiados según Abuelas. Restituidos: identidades recuperadas hasta julio de 2025. Buscados: casos que Abuelas sigue buscando. Abuelas estima unos 500 niños apropiados; es una estimación basada en las denuncias de embarazadas desaparecidas y niños secuestrados, sin listado completo. Hasta julio de 2025 se restituyeron 140 identidades (no encontré restituciones posteriores anunciadas). Abuelas dice que faltan encontrar unos 300; la suma de restituidos y buscados (440) es menor que la estimación original porque algunos casos se descartaron o cerraron. Las restituciones se confirman con el Banco Nacional de Datos Genéticos."

  - id: sifilis
    tema: 14
    titulo: "Sífilis: casos notificados cada 100.000 habitantes"
    que_muestra: "Tasa de casos confirmados de sífilis en la población general notificados al Sistema Nacional de Vigilancia de la Salud."
    original: {ficha: p344, imagen: 1368}
    tipo: lineas
    frecuencia: A
    desde: "2019"
    unidad: "casos por 100.000 habitantes"
    tipo_valor: tasa
    medida_inicial: nivel
    medidas: [nivel, variacion]
    series:
      - {serie: sifilis_tasa, nombre: "Sífilis (población general)"}
    fuentes:
      - {nombre: "Ministerio de Salud, Boletín Epidemiológico Nacional N° 782 (citado en el informe epidemiológico de Santa Fe, SE 47 de 2025)", url: "https://www.santafe.gov.ar/index.php/web/content/download/283300/1465375/file/INFORME_EPIDEMIOLOGICO_SE47_2025.pdf", nivel: secundaria}
    metodo: "Son casos notificados, no la cantidad real de personas con sífilis: dependen de cuánto se testea y se notifica. La baja de 2020 y 2021 coincide con la pandemia (menos consultas y testeos). Desde 2022 la notificación es nominal (por persona), lo que también mejora el registro. En 2024 se notificaron 36.917 casos, el récord de la serie; los más afectados son los jóvenes de 20 a 24 años. El original pedía el porcentaje de la población que tuvo sífilis por edad: no hay estudios de prevalencia poblacional."

  - id: vih
    tema: 14
    titulo: "VIH: personas de 15 a 49 años que viven con el virus"
    que_muestra: "Porcentaje estimado de la población de 15 a 49 años que vive con VIH."
    original: {ficha: p343, imagen: 0}
    tipo: lineas
    frecuencia: A
    desde: "2001"
    unidad: "% de la población de 15 a 49 años"
    tipo_valor: tasa
    medida_inicial: nivel
    medidas: [nivel, variacion]
    series:
      - {serie: owid_vih_prevalencia, nombre: "Prevalencia de VIH"}
    fuentes:
      - {nombre: "ONUSIDA, estimaciones nacionales de VIH, vía Our World in Data", url: "https://ourworldindata.org/grapher/share-of-the-population-infected-with-hiv?country=~ARG", nivel: secundaria}
      - {nombre: "Ministerio de Salud, Boletín N° 40 de respuesta al VIH y las ITS (2023)", url: "https://argentina.gob.ar/sites/default/files/2024/04/sintesis_boletin_n_40_de_respuesta_al_vih_y_las_its_en_la_argentina_1642024.pdf", nivel: primaria, nota: "Diagnósticos notificados y tasas por provincia"}
    metodo: "Estimaciones modeladas de ONUSIDA a partir de la vigilancia del Ministerio de Salud: incluyen a quienes no saben que tienen VIH. Según el Ministerio, en 2022 se diagnosticaron 12,2 casos nuevos cada 100.000 habitantes y casi todas las infecciones son por relaciones sexuales sin protección. El original pedía la prevalencia por grupo de edad (16 a 60 años): no se publica una serie así."

  - id: desnutricion_infantil
    tema: 13
    titulo: "Desnutrición crónica y sobrepeso en niños menores de 5 años"
    que_muestra: "Porcentaje de niños menores de 5 años con baja talla para la edad (desnutrición crónica) y con sobrepeso."
    original: {ficha: p334, imagen: 1341}
    tipo: lineas
    frecuencia: A
    desde: "2001"
    unidad: "% de los menores de 5 años"
    tipo_valor: tasa
    medida_inicial: nivel
    medidas: [nivel, variacion]
    series:
      - {serie: owid_sobrepeso_infantil, nombre: "Sobrepeso"}
      - {serie: owid_baja_talla, nombre: "Baja talla (desnutrición crónica)"}
    fuentes:
      - {nombre: "UNICEF, OMS y Banco Mundial, estimaciones conjuntas de malnutrición infantil, vía Our World in Data", url: "https://ourworldindata.org/grapher/share-of-children-younger-than-5-who-suffer-from-stunting?country=~ARG", nivel: secundaria}
    metodo: "Sobrepeso: estimación anual modelada. Baja talla: solo hay dato en los años con encuesta nacional (2005 y 2018-2019); la línea une esas dos mediciones. En la Argentina el problema nutricional infantil más extendido es el exceso de peso, no la desnutrición aguda (bajo peso para la talla), que afecta a menos del 2%. El original usaba la indigencia infantil como aproximación: es un indicador de ingresos, no de nutrición; según el INDEC, en el primer semestre de 2026 el 10,8% de los chicos de 0 a 14 años vivía en hogares indigentes."

  - id: salud_mental_prevalencia
    tema: 15
    titulo: "Trastornos mentales en adultos: prevalencia a lo largo de la vida"
    que_muestra: "Porcentaje de adultos que tuvieron alguna vez en la vida cada grupo de trastornos mentales, según el primer estudio epidemiológico nacional."
    original: {ficha: p347, imagen: 1399}
    tipo: barras
    categorias: salud_mental_prevalencia
    unidad: "% de la población de 18 años y más"
    tipo_valor: tasa
    fuentes:
      - {nombre: "Stagnaro, Cía y otros, Estudio epidemiológico de salud mental en población general de la República Argentina (Encuesta Mundial de Salud Mental OMS/Harvard), Vertex 2018", url: "https://busqueda.bvsalud.org/portal/resource/pt/mdl-30785970", nivel: primaria}
    metodo: "Encuesta a 3.927 adultos de los principales centros urbanos, con diagnósticos según criterios internacionales (no autopercepción). Es la única medición nacional de este tipo: no hay una serie histórica. Una persona puede tener más de un trastorno, por eso los porcentajes no se suman. La esquizofrenia y otras psicosis no se miden en este tipo de encuestas de hogares."
