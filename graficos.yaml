    que_muestra: "Gasto del Estado nacional, del conjunto de las provincias y de los municipios, como % del PIB. Apiladas, suman el gasto público consolidado."
    original: {ficha: p63, imagen: 1139}
    tipo: areas
    frecuencia: A
    desde: "2001"
    unidad: "% del PIB"
    tipo_valor: tasa
    medida_inicial: nivel
    medidas: [nivel, variacion]
    series:
      - {serie: gpn_total, nombre: "Nación"}
      - {serie: gpp_total, nombre: "Provincias (incluye CABA)"}
      - {serie: gpm_total, nombre: "Municipios"}
    fuentes:
