    metodo: "Indicador del cuestionario IPAQ adaptado. El INDEC no publica el dato de 2005 por problemas de comparabilidad y pide leer el indicador con cautela. La línea une las ediciones; no hay datos entre ellas. El original mostraba de 6 a 85 años con cuatro niveles de actividad y un pico en 2020: ninguna fuente oficial lo releva así, por eso se muestra el indicador de adultos de la encuesta."

  - id: mortalidad_por_causa
    tema: 14
    titulo: "Mortalidad por grandes grupos de causas"
    que_muestra: "Defunciones por cada 100.000 habitantes, ajustadas por edad, según la causa registrada en los certificados de defunción."
    original: {ficha: p339, imagen: 1284}
    tipo: areas
    frecuencia: A
    desde: "2001"
    unidad: "muertes por 100.000 habitantes (ajustada por edad)"
    tipo_valor: tasa
    medida_inicial: nivel
    medidas: [nivel, variacion]
    series:
      - {serie: mdb_cardio, nombre: "Cardiovasculares"}
      - {serie: mdb_cancer, nombre: "Cáncer (tumores malignos)"}
      - {serie: mdb_respiratorias, nombre: "Respiratorias (no infecciosas)"}
      - {serie: mdb_infec_resp, nombre: "Infecciones respiratorias (neumonía, gripe, COVID-19)"}
      - {serie: mdb_infecciosas, nombre: "Otras infecciosas y parasitarias"}
    fuentes:
      - {nombre: "Organización Mundial de la Salud, Mortality Database (datos que envía la DEIS del Ministerio de Salud), procesados por Our World in Data", url: "https://ourworldindata.org/grapher/death-rate-by-cause-who-mdb?country=~ARG", nivel: secundaria}
      - {nombre: "Ministerio de Salud, DEIS: estadísticas vitales", url: "https://www.argentina.gob.ar/salud/deis", nivel: primaria}
    metodo: "Tasas anuales estandarizadas por edad (con la población estándar de la OMS), para que el envejecimiento de la población no se confunda con más o menos enfermedad. Por eso no coinciden con las tasas brutas de la DEIS. Las bases mensuales de la DEIS se pueden bajar solo desde su servidor, que hoy rechaza las conexiones automáticas; el original mostraba una serie mensual estimada y proyectada que no se publica. Clasificación de causas de la OMS (CIE-10); la COVID-19 queda dentro de infecciones respiratorias, de ahí el salto de 2020 y 2021."

