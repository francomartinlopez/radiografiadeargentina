    metodo: "Estimaciones de la OMS a partir de las estadísticas de defunciones de la DEIS, ajustadas por edad (por eso difieren algo de las tasas brutas oficiales). Los intentos de suicidio no se miden en forma continua: el Ministerio de Salud los registra en el sistema de vigilancia solo desde 2023, por eso no se incluyen (fichas p354 y p355). Si estás atravesando un momento difícil podés llamar al 135 (gratis desde CABA y el Gran Buenos Aires), al (011) 5275-1135 o al 0800-345-1435 desde todo el país (Centro de Asistencia al Suicida), o a la línea de salud mental del Ministerio de Salud, 0800-999-0091, las 24 horas."

