    fuentes:
      - {nombre: "Grupo Interagencial de Naciones Unidas para la Estimación de la Mortalidad en la Niñez (UN IGME), vía Banco Mundial", url: "https://data.worldbank.org/indicator/SH.DYN.1014?locations=AR", nivel: secundaria}
    metodo: "Estimaciones anuales de Naciones Unidas hechas sobre los registros de defunciones y la población de la Argentina. Se usan los grupos 5-9, 10-14 y 15-19 años porque no hay una serie publicada para 5 a 17 como pedía el original. En los adolescentes de 15 a 19 pesan sobre todo las causas externas (tránsito, agresiones, suicidios)."

