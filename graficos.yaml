    metodo: "Actividad: promedio de la variación interanual de los últimos 6 meses del EMAE de cada rama; para construcción, el ISAC. Empleo: asalariados privados registrados del SIPA en el último mes con dato de todas las ramas; la participación se calcula sobre la suma de las ramas mostradas. Creó/perdió empleo: variación interanual de esos asalariados mayor a +0,5% o menor a −0,5%."

  - id: pib_per_capita_largo
    tema: 19
    titulo: "PIB por habitante desde 1850"
    que_muestra: "Producto por habitante de la Argentina y de seis países de referencia, en dólares internacionales de 2011 (paridad de poder adquisitivo)."
    original: {ficha: p18, imagen: 1427}
    tipo: lineas_pais
    frecuencia: A
    desde: "1850"
    unidad: "US$ de 2011 (PPA)"
    tipo_valor: nivel
    medida_inicial: nivel
    series:
      - {serie: maddison23_arg, nombre: "Argentina"}
      - {serie: maddison23_bra, nombre: "Brasil"}
      - {serie: maddison23_esp, nombre: "España"}
      - {serie: maddison23_ita, nombre: "Italia"}
      - {serie: maddison23_gbr, nombre: "Gran Bretaña"}
      - {serie: maddison23_aus, nombre: "Australia"}
      - {serie: maddison23_usa, nombre: "EE.UU."}
    fuentes:
      - {nombre: "Maddison Project Database 2023 (Bolt y van Zanden), vía Our World in Data", url: "https://www.rug.nl/ggdc/historicaldevelopment/maddison/releases/maddison-project-database-2023", nivel: secundaria, nota: "Compila estimaciones de historiadores económicos y estadísticas oficiales de cada país."}
    metodo: "PIB real por habitante en dólares internacionales de 2011 (edición 2023 del Maddison Project, que llega a 2022). Antes de 1950 hay años sin dato (sobre todo en Brasil y en el siglo XIX): la línea une los años con dato. Para años recientes, ver PIB por habitante del Banco Mundial (a paridad de poder adquisitivo de 2021). Reúne las fichas p18 y p428 (ingresos por hogar desde 1850, que no tienen una serie histórica comparable)."
    tramos:
      - {hasta: "1949-12", tipo: estimado, nota: "Antes de 1950 los valores son reconstrucciones históricas del Maddison Project, con mayor margen de error que las cuentas nacionales posteriores."}

