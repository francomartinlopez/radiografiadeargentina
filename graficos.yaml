    metodo: "Cuenta víctimas directas de femicidio identificadas en causas judiciales (en 2023 fueron 250; en 2024, una cada 39 horas). No incluye femicidios vinculados (personas asesinadas para dañar a una mujer) ni travesticidios y transfemicidios, que el registro informa aparte. Las cifras de cada año pueden revisarse en informes posteriores. La serie empieza en 2017, cuando se consolidó la metodología del registro; con la metodología anterior, la tasa de 2014 fue 1,03. Los homicidios de mujeres y varones en general están en Homicidios por sexo de la víctima."

