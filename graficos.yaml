    metodo: "Serie trimestral oficial desde 2016. Antes de 2016 no hay una serie oficial homogénea por tipo de subsidio: el período 2001-2015 y la apertura por transporte y agua del original quedan para el lote de estimaciones. El gasto en servicios económicos desde 1980 está en Gasto público nacional por finalidad."

