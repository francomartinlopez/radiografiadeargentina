# Catálogo de gráficos de Radiografía de la Argentina
#
# Las series (de dónde se baja cada dato, empalmes y cálculos) se definen en indicadores.yaml,
# la base compartida con Datos de Argentina. Este archivo dice qué gráfico se publica con ellas.
#
# Campos de cada gráfico:
#   id            identificador (también nombre del archivo en sitio/public/datos/graficos/)
#   tema          número de tema (ver "temas")
#   titulo        título del gráfico
#   que_muestra   una o dos oraciones: qué datos muestra
#   original      {ficha: p25, imagen: 1031} = gráfico del documento que reemplaza (ver docs/Inventario...)
#   tipo          lineas | areas | barras | barras_gobierno | lineas_pais | burbujas
#   frecuencia    M (mensual) | T (trimestral) | S (semestral) | A (anual)
#   desde         inicio del período original ("2001-01", "1850"); si se omite, el primer dato
#   unidad        unidad de la serie en nivel (después de moneda constante)
#   tipo_valor    indice | nivel | flujo | tasa | saldo (como en indicadores.yaml)
#                 tasa y saldo: las variaciones se expresan en puntos o en diferencia, no en %
#   moneda        ARS | USD -> se expresa en moneda constante del último mes con dato
#   flujo         true -> habilita "Acumulado 12 meses"
#   medida_inicial nivel | variacion | interanual | acumulado_12m | base_100
#   series        lista de {serie, nombre, color (opcional)}; en lineas_pais, una por país
#   gobiernos     true/false -> franjas y líneas de gobierno (por defecto: sí en lineas y areas)
#   agregar_por_gobierno  promedio | suma | ultimo -> para barras_gobierno, calculado desde la serie
#   categorias    para barras/burbujas sin eje de tiempo: archivo en data/categorias/<id>.csv
#   fuentes       lista de {nombre, url, nivel, desde, hasta, nota}
#                 nivel: primaria | secundaria | terciaria | estimacion
#   metodo        cómo se armó el dato (cálculos, empalmes, deflactor)
#   tramos        partes que no son dato observado: {serie (opcional), desde, hasta,
#                 tipo: estimado | interpolado | proyectado, nota}. Se dibujan punteadas con ⚠.
#   estimacion    texto -> todo el gráfico es una estimación: ⚠ arriba y explicación
#   sensible      texto -> aclaración visible sobre fuente, nivel y alcance de los datos

parametros:
  base_ultimo_mandato: "2023-11-01"   # mes previo a la asunción del gobierno actual

temas:
  1: "Actividad económica, PBI y estructura productiva"
  2: "Inflación, dinero y política monetaria"
  3: "Fiscal, deuda e impuestos"
  4: "Sector externo, divisas y mercado cambiario"
  5: "Crédito, mora y sistema financiero"
  6: "Empleo, salarios e ingresos"
  7: "Empresas y tejido productivo"
  8: "Agro, ganadería y clima"
  9: "Energía, hidrocarburos y servicios"
  10: "Vehículos, transporte y seguridad vial"
  11: "Comercio, consumo y bienes"
  12: "Demografía, migración y religión"
  13: "Pobreza, condiciones sociales y planes"
  14: "Salud y enfermedad"
  15: "Salud mental, suicidio y adicciones"
  16: "Educación y cultura"
  17: "Vivienda y servicios del hogar"
  18: "Política, instituciones y opinión pública"
  19: "Comparativas internacionales"
  20: "Criminalidad, violencia de género y homicidios"
  21: "Memoria y derechos humanos (1973–1983)"
  22: "Sistema previsional y AFJP"

# Gobiernos para las franjas (fecha de asunción). Puerta, Rodríguez Saá y Camaño se agrupan.
gobiernos:
  - {nombre: "Fernando de la Rúa", corto: "De la Rúa", desde: "1999-12-10"}
  - {nombre: "Transición (Puerta, Rodríguez Saá, Camaño)", corto: "Transición", desde: "2001-12-21"}
  - {nombre: "Eduardo Duhalde", corto: "Duhalde", desde: "2002-01-02"}
  - {nombre: "Néstor Kirchner", corto: "N. Kirchner", desde: "2003-05-25"}
  - {nombre: "Cristina Fernández de Kirchner I", corto: "CFK I", desde: "2007-12-10"}
  - {nombre: "Cristina Fernández de Kirchner II", corto: "CFK II", desde: "2011-12-10"}
  - {nombre: "Mauricio Macri", corto: "Macri", desde: "2015-12-10"}
  - {nombre: "Alberto Fernández", corto: "A. Fernández", desde: "2019-12-10"}
  - {nombre: "Javier Milei", corto: "Milei", desde: "2023-12-10"}

graficos:
  - id: inflacion_minorista
    tema: 2
    titulo: "Inflación minorista (IPC)"
    que_muestra: "Variación de los precios al consumidor. El nivel del índice se empalma con distintas mediciones oficiales para cubrir los años en que el IPC del INDEC estuvo intervenido."
    original: {ficha: p25, imagen: 1031}
    tipo: lineas
    frecuencia: M
    desde: "2001-01"
    unidad: "índice"
    tipo_valor: indice
    medida_inicial: variacion
    series:
      - {serie: ipc, nombre: "IPC empalmado"}
    fuentes:
      - {nombre: "INDEC, IPC del Gran Buenos Aires", url: "https://www.indec.gob.ar/indec/web/Nivel4-Tema-3-5-31", nivel: primaria, hasta: "2006-12"}
      - {nombre: "Dirección Provincial de Estadística de San Luis, IPC", nivel: primaria, desde: "2007-01", hasta: "2012-07", nota: "Se usa en lugar del IPC del INDEC de esos años, que estaba intervenido."}
      - {nombre: "Instituto de Estadística de la Ciudad de Buenos Aires, IPCBA", url: "https://www.estadisticaciudad.gob.ar/eyc/?cat=93", nivel: primaria, desde: "2012-08", hasta: "2016-12"}
      - {nombre: "INDEC, IPC nacional", url: "https://www.indec.gob.ar/indec/web/Nivel4-Tema-3-5-31", nivel: primaria, desde: "2017-01"}
    metodo: "Se encadenan las variaciones mensuales de cada tramo (empalme). Datos bajados de la API de Series de Tiempo de datos.gob.ar."

  - id: actividad_emae
    tema: 1
    titulo: "Actividad económica (EMAE)"
    que_muestra: "Estimador Mensual de Actividad Económica del INDEC: serie original y desestacionalizada."
    original: {ficha: p8, imagen: 1069}
    tipo: lineas
    frecuencia: M
    unidad: "índice 2004=100"
    tipo_valor: indice
    medida_inicial: nivel
    series:
      - {serie: emae_original, nombre: "Original", color: gris}
      - {serie: emae_desest, nombre: "Desestacionalizada"}
    fuentes:
      - {nombre: "INDEC, EMAE base 2004", url: "https://www.indec.gob.ar/indec/web/Nivel4-Tema-3-9-48", nivel: primaria}
    metodo: "Series publicadas por el INDEC, sin transformaciones. Bajadas de la API de Series de Tiempo de datos.gob.ar."

  - id: recaudacion_total
    tema: 3
    titulo: "Recaudación tributaria nacional"
    que_muestra: "Recaudación total de impuestos nacionales y aportes a la seguridad social, en pesos de hoy."
    original: {ficha: p56, imagen: 1108}
    tipo: lineas
    frecuencia: M
    desde: "2001-01"
    unidad: "millones de pesos de hoy"
    tipo_valor: flujo
    moneda: ARS
    flujo: true
    medida_inicial: acumulado_12m
    series:
      - {serie: recaudacion, nombre: "Recaudación total"}
    fuentes:
      - {nombre: "Ministerio de Economía, Recaudación tributaria (ARCA)", url: "https://www.argentina.gob.ar/economia/ingresospublicos/recaudacion", nivel: primaria}
      - {nombre: "IPC empalmado (ver Inflación minorista)", nivel: primaria, nota: "Deflactor"}
    metodo: "Recaudación mensual en pesos corrientes llevada a pesos del último mes con dato con el IPC empalmado."

  - id: riesgo_pais
    tema: 3
    titulo: "Riesgo país"
    que_muestra: "Diferencia de tasa entre los bonos argentinos en dólares y los del Tesoro de EE.UU. (índice EMBI de JP Morgan), promedio mensual."
    original: {ficha: p46, imagen: 1047}
    tipo: lineas
    frecuencia: M
    desde: "2001-01"
    unidad: "puntos básicos"
    tipo_valor: tasa
    medida_inicial: nivel
    series:
      - {serie: riesgo_pais, nombre: "Riesgo país"}
    fuentes:
      - {nombre: "JP Morgan, EMBI Argentina (vía ArgentinaDatos)", url: "https://argentinadatos.com", nivel: secundaria, nota: "JP Morgan no publica la serie abierta; se toma de una compilación pública."}
    metodo: "Promedio mensual del dato diario."

  - id: recaudacion_por_impuesto
    tema: 3
    titulo: "Recaudación por impuesto"
    que_muestra: "Recaudación nacional por tipo de impuesto (IVA, Ganancias, seguridad social, cheque, combustibles, retenciones, aranceles y el resto), en pesos de hoy."
    original: {ficha: p56, imagen: 1108}
    tipo: areas
    frecuencia: M
    desde: "2003-01"
    unidad: "millones de pesos de hoy"
    tipo_valor: flujo
    moneda: ARS
    flujo: true
    medida_inicial: acumulado_12m
    series:
      - {serie: rec_iva, nombre: "IVA"}
      - {serie: rec_ganancias, nombre: "Ganancias"}
      - {serie: rec_seguridad_social, nombre: "Seguridad social"}
      - {serie: rec_cheque, nombre: "Cheque"}
      - {serie: rec_combustibles, nombre: "Combustibles"}
      - {serie: rec_derechos_exportacion, nombre: "Retenciones"}
      - {serie: rec_derechos_importacion, nombre: "Aranceles"}
      - {serie: rec_resto, nombre: "Resto"}
    fuentes:
      - {nombre: "ARCA (ex AFIP), recaudación mensual por impuesto", url: "https://www.afip.gob.ar/institucional/estudios/recaudacion-mensual.asp", nivel: primaria}
      - {nombre: "Ministerio de Economía, recaudación tributaria total", url: "https://www.argentina.gob.ar/economia/ingresospublicos/recaudacion", nivel: primaria, nota: "Para calcular el resto"}
    metodo: "Recaudación mensual de cada impuesto en pesos corrientes, llevada a pesos de hoy con el IPC empalmado. «Resto» es el total menos los impuestos mostrados (Bienes Personales, internos, monotributo impositivo y otros)."

  - id: saldo_comercial
    tema: 4
    titulo: "Balanza comercial"
    que_muestra: "Exportaciones menos importaciones de bienes de cada mes, en dólares de hoy. Arriba de cero, superávit; abajo, déficit."
    original: {ficha: p106, imagen: 1038}
    tipo: barras
    frecuencia: M
    desde: "2001-01"
    unidad: "millones de US$ de hoy"
    tipo_valor: saldo
    moneda: USD
    flujo: true
    medida_inicial: nivel
    series:
      - {serie: saldo_comercial, nombre: "Saldo comercial"}
    fuentes:
      - {nombre: "INDEC, Intercambio comercial argentino (ICA)", url: "https://www.indec.gob.ar/indec/web/Nivel4-Tema-3-2-40", nivel: primaria}
      - {nombre: "FRED, IPC de Estados Unidos (CPI-U)", url: "https://fred.stlouisfed.org/series/CPIAUCSL", nivel: primaria, nota: "Deflactor de los dólares"}
    metodo: "Exportaciones menos importaciones en dólares corrientes, llevadas a dólares del último mes con dato con el IPC de Estados Unidos."

  - id: inflacion_por_gobierno
    tema: 2
    titulo: "Inflación mensual promedio por gobierno"
    que_muestra: "Promedio de la inflación mensual (IPC empalmado) durante cada gobierno, desde De la Rúa."
    original: {ficha: p25, imagen: 1031}
    tipo: barras_gobierno
    frecuencia: M
    desde: "2000-01"
    unidad: "% mensual promedio"
    tipo_valor: tasa
    medida_por_gobierno: variacion
    agregar_por_gobierno: promedio
    series:
      - {serie: ipc, nombre: "Inflación mensual"}
    fuentes:
      - {nombre: "IPC empalmado: INDEC (GBA hasta 2006 y nacional desde 2017), San Luis (2007–2012) y Ciudad de Buenos Aires (2012–2016)", nivel: primaria}
    metodo: "Variación mensual del IPC empalmado, promediada para los meses de cada gobierno. El mes de una asunción cuenta para quien gobernó la mayor parte de ese mes. El gobierno actual incluye hasta el último dato."

  - id: sectores_actividad_empleo
    tema: 6
    titulo: "Actividad y empleo por sector"
    que_muestra: "Cada burbuja es un sector: a la derecha, los que más crecieron en actividad; arriba, los que más empleo concentran. El color indica si sumaron o perdieron asalariados registrados en el último año."
    original: {ficha: p404, imagen: 1124}
    tipo: burbujas
    frecuencia: M
    unidad: ""
    eje_x: "Actividad: variación interanual promedio de los últimos 6 meses (%)"
    eje_y: "Participación en el empleo asalariado registrado (%)"
    meses: 6
    burbujas:
      - {categoria: "Agro", x: emae_agro, y: asal_agro}
      - {categoria: "Pesca", x: emae_pesca, y: asal_pesca}
      - {categoria: "Minería y petróleo", x: emae_mineria, y: asal_mineria}
      - {categoria: "Industria", x: emae_industria, y: asal_industria}
      - {categoria: "Electricidad, gas y agua", x: emae_egu, y: asal_egu}
      - {categoria: "Construcción", x: isac_original, y: asal_construccion}
      - {categoria: "Comercio", x: emae_comercio, y: asal_comercio}
      - {categoria: "Hoteles y restaurantes", x: emae_hoteles, y: asal_hoteles}
      - {categoria: "Transporte y comunicaciones", x: emae_transporte, y: asal_transporte}
      - {categoria: "Inmobiliarias y servicios a empresas", x: emae_inmobiliario, y: asal_inmobiliarias}
      - {categoria: "Enseñanza", x: emae_ensenanza, y: asal_ensenanza}
      - {categoria: "Salud", x: emae_salud, y: asal_salud}
    fuentes:
      - {nombre: "INDEC, EMAE por rama de actividad", url: "https://www.indec.gob.ar/indec/web/Nivel4-Tema-3-9-48", nivel: primaria}
      - {nombre: "INDEC, ISAC (construcción)", url: "https://www.indec.gob.ar/indec/web/Nivel4-Tema-3-3-42", nivel: primaria}
      - {nombre: "Secretaría de Trabajo, SIPA: asalariados privados registrados por rama", url: "https://www.argentina.gob.ar/trabajo/estadisticas", nivel: primaria}
    metodo: "Actividad: promedio de la variación interanual de los últimos 6 meses del EMAE de cada rama; para construcción, el ISAC. Empleo: asalariados privados registrados del SIPA en el último mes con dato de todas las ramas; la participación se calcula sobre la suma de las ramas mostradas. Creó/perdió empleo: variación interanual de esos asalariados mayor a +0,5% o menor a −0,5%."

  - id: pib_per_capita_largo
    tema: 19
    titulo: "PIB por habitante desde 1850"
    que_muestra: "Producto por habitante de la Argentina y de seis países de referencia, en dólares internacionales de 2011 (paridad de poder adquisitivo)."
    original: {ficha: p18, imagen: 1427}
    tipo: lineas_pais
    frecuencia: A
    desde: "1850"
    unidad: "US$ de 2011 (PPA)"
    tipo_valor: nivel
    medida_inicial: nivel
    series:
      - {serie: pibpc_maddison_arg, nombre: "Argentina"}
      - {serie: pibpc_maddison_bra, nombre: "Brasil"}
      - {serie: pibpc_maddison_esp, nombre: "España"}
      - {serie: pibpc_maddison_ita, nombre: "Italia"}
      - {serie: pibpc_maddison_gbr, nombre: "Gran Bretaña"}
      - {serie: pibpc_maddison_aus, nombre: "Australia"}
      - {serie: pibpc_maddison_usa, nombre: "EE.UU."}
    fuentes:
      - {nombre: "Maddison Project Database 2020 (Bolt y van Zanden), vía Our World in Data", url: "https://www.rug.nl/ggdc/historicaldevelopment/maddison/releases/maddison-project-database-2020", nivel: secundaria, nota: "Compila estimaciones de historiadores económicos y estadísticas oficiales de cada país."}
    metodo: "PIB real por habitante en dólares internacionales de 2011. Antes de 1950 hay años sin dato (sobre todo en Brasil y en el siglo XIX): la línea une los años con dato. La serie llega a 2018, el último año de esta edición."
    tramos:
      - {hasta: "1949-12", tipo: estimado, nota: "Antes de 1950 los valores son reconstrucciones históricas del Maddison Project, con mayor margen de error que las cuentas nacionales posteriores."}
