    metodo: "Total de vetos dividido por los años de mandato (para Milei, hasta septiembre de 2025). Corrige que los mandatos tengan distinta duración: Duhalde y De la Rúa, en presidencias cortas y de crisis, son los que más vetaron por año."

  - id: inmigrantes_censos
    tema: 12
