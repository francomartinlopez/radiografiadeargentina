    metodo: "Existencias declaradas en el sistema de gestión sanitaria del SENASA, consolidadas al 31 de diciembre. La serie oficial empieza en 2007 (no hay un dato comparable para 2001 a 2006). Hembras: vacas y vaquillonas (los vientres) más terneras; machos: novillos, novillitos, toros, toritos, bueyes y terneros. La caída de 2008-2009 refleja la sequía y la liquidación de vientres."

  - id: blanqueos
    tema: 3
    titulo: "Blanqueos de capitales: montos declarados"
    que_muestra: "Bienes y dinero declarados en cada régimen de exteriorización (blanqueo), en millones de dólares de cada año y en dólares de hoy."
    original: {ficha: p98, imagen: 1403}
    tipo: barras
    categorias: blanqueos
    unidad: "millones de dólares"
    tipo_valor: nivel
    fuentes:
      - {nombre: "AFIP, montos de los blanqueos de 2009 y 2013-2015 (citados por Chequeado)", url: "https://chequeado.com/ultimas-noticias/prat-gay-es-el-blanqueo-mas-importante-de-la-historia-argentina/", nivel: secundaria}
      - {nombre: "AFIP, cierre del sinceramiento fiscal de la Ley 27.260 (citado por El Cronista)", url: "https://www.cronista.com/economia-politica/nuevo-blanqueo-los-puntos-debiles-del-borrador-de-milei-y-las-lecciones-de-los-anteriores", nivel: secundaria}
      - {nombre: "ARCA, balance del régimen de regularización de activos de la Ley 27.743 a diciembre de 2024 (El Economista)", url: "https://eleconomista.com.ar/economia/arca-lo-confirmo-blanqueo-sumo-mas-us-32000-millones-n80726", nivel: secundaria}
      - {nombre: "Índice de precios al consumidor de Estados Unidos (BLS, vía FRED)", url: "https://fred.stlouisfed.org/series/CPIAUCSL", nivel: primaria, nota: "Deflactor"}
    metodo: "Leyes 26.476 (2009), 26.860 (2013-2015), 27.260 (2016-2017) y 27.743 (2024-2025). Monto total declarado (dinero, inmuebles, acciones y otros bienes, en el país y en el exterior), no lo que pagó de impuesto ni lo que volvió al país. Para llevarlo a dólares de hoy se usa el índice de precios de Estados Unidos del promedio del año del blanqueo (2013-2015: promedio de los tres años). El de 2024 es el balance oficial de diciembre de 2024 (US$ 22.000 millones en efectivo y US$ 10.000 millones en otros bienes); la etapa final, hasta marzo de 2025, no tiene un total oficial publicado que haya podido verificar. El original sumaba moratorias e 'inocencia fiscal', que no son blanqueos de capitales y no se incluyen."

