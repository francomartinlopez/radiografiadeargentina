  - id: actividad_sin_mineria
    tema: 1
    titulo: "Actividad económica sin minería, petróleo ni gas (estimación)"
    que_muestra: "Actividad económica total comparada con la actividad sin el sector de minas y canteras (que incluye petróleo y gas), y la minería sola."
    original: {ficha: p2, imagen: 1061}
    tipo: lineas
    frecuencia: M
    desde: "2005-01"
    unidad: "índice 2004=100"
    tipo_valor: indice
    medida_inicial: nivel
    medidas: [nivel, base_100, interanual]
    series:
      - {serie: emae_12m, nombre: "EMAE total", color: gris}
      - {serie: emae_sin_mineria_12m, nombre: "Sin minería, petróleo ni gas (estimación)"}
      - {serie: emae_mineria_12m, nombre: "Minas y canteras"}
    fuentes:
      - {nombre: "INDEC, EMAE total y por sector", url: "https://www.indec.gob.ar/indec/web/Nivel4-Tema-3-9-48", nivel: primaria}
      - {nombre: "INDEC, valor agregado bruto por sector a precios de 2004", url: "https://datos.gob.ar/series/api/series/?ids=6.1_EMC_2004_A_26,6.1_VABPB_2004_A_36", nivel: primaria, nota: "Ponderador de la minería"}
      - {nombre: "Cálculo propio", nivel: estimacion}
    metodo: "⚠ Estimación: EMAE sin minería = (EMAE total − 5,9% × EMAE minería) / (1 − 5,9%). El 5,9% es el peso de 'Explotación de minas y canteras' en el valor agregado de 2004, año base de ambos índices. Es una aproximación: el INDEC encadena los sectores con ponderaciones que cambian y el EMAE total incluye impuestos. Las tres series se muestran en promedio de 12 meses para sacar la estacionalidad."
    estimacion: "La serie sin minería es un cálculo propio sobre índices oficiales del INDEC."
    tramos:
      - {desde: "2005-01", tipo: estimado, nota: "Toda la serie sin minería es una estimación.", serie: emae_sin_mineria_12m}

