    metodo: "Explotaciones con límites definidos y mixtas (227.323, con 154,8 millones de hectáreas). El 5% de las explotaciones con más de 2.500 hectáreas reúne el 64% de la superficie; un tercio de las explotaciones tiene menos de 25 hectáreas y ocupa el 0,5%. En total se censaron 249.663 explotaciones (incluidas las que no tienen límites definidos). El original comparaba 2004 con 2025, pero no hubo censos en esos años (el de 2008 quedó incompleto) y 2025 era una estimación."

