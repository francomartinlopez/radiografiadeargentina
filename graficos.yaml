  - id: el_nino
    tema: 8
    titulo: "El Niño y La Niña"
    que_muestra: "Índice Oceánico de El Niño (ONI): temperatura del Pacífico ecuatorial respecto de lo normal. Arriba de +0,5 °C hay El Niño (más lluvias en la región pampeana); abajo de −0,5 °C, La Niña (sequías)."
    original: {ficha: p203, imagen: 1312}
    tipo: barras
    frecuencia: M
    desde: "2001-01"
    gobiernos: false
    unidad: "°C de anomalía"
    tipo_valor: saldo
    medida_inicial: nivel
    medidas: [nivel]
    series:
      - {serie: oni, nombre: "ONI"}
    fuentes:
      - {nombre: "NOAA (EE.UU.), Oceanic Niño Index", url: "https://psl.noaa.gov/data/correlation/oni.data", nivel: primaria}
    metodo: "Promedio móvil de tres meses de la anomalía de temperatura del mar en la región Niño 3.4. Para cruzarlo con las cosechas, ver Producción de los principales granos: las grandes caídas (2008/09, 2017/18, 2022/23) coinciden con años de La Niña. El pronóstico 2026-2027 del original queda para el lote 6."
