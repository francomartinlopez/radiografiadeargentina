    metodo: "Serie anual oficial, en % del PIB. El gasto de cada nivel se cuenta neto de las transferencias entre niveles (lo que la Nación gira a las provincias figura como gasto de quien lo ejecuta), por eso la suma da el consolidado sin doble conteo. Se publica con unos dos años de rezago. El original mostraba un índice mensual en pesos constantes que no tiene fuente: no hay datos mensuales del gasto provincial."

  - id: ingreso_por_estrato
    tema: 6
    titulo: "Ingreso por persona según estrato de ingresos"
    que_muestra: "Ingreso mensual promedio por persona en hogares de cada estrato, en pesos de hoy: el 40% de menores ingresos, el 40% siguiente, el decil 9 y el 10% más rico."
    original: {ficha: p167, imagen: 1281}
    tipo: lineas
    frecuencia: T
    desde: "2003-01"
    unidad: "pesos de hoy por persona por mes"
    tipo_valor: nivel
    moneda: ARS
    medida_inicial: nivel
    series:
      - {serie: ipcf_alto, nombre: "10% más rico (decil 10)"}
      - {serie: ipcf_medio_alto, nombre: "Decil 9"}
      - {serie: ipcf_medio, nombre: "Deciles 5 a 8"}
      - {serie: ipcf_bajo, nombre: "40% más pobre (deciles 1 a 4)"}
    fuentes:
